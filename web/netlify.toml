[build]
  command = "pnpm run build:client"
  functions = "netlify/functions"
  publish = "dist/spa"

[build.environment]
  NPM_FLAGS = "--version"
  VITE_SUPABASE_URL = "https://cwligyakhxevopxiksdm.supabase.co"

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"

# Classic Meerkat now runs on the OS: the app at os.goconstellation.com/meerkat/
# and its functions at /meerkat-api/ (OS PR #2461, ClickUp 86e3v306a). This site
# only forwards. Rollback: revert this file to its previous redirects.

# Machine callers (OS health bot, webhooks) keep working at the old address:
# proxied, so POST bodies and responses pass through unchanged.
[[redirects]]
  force = true
  from = "/health"
  status = 200
  to = "https://os.goconstellation.com/meerkat-api/health"

[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "https://os.goconstellation.com/meerkat-api/api/:splat"

# People land on the new address.
[[redirects]]
  force = true
  from = "/share-article/*"
  status = 301
  to = "https://os.goconstellation.com/meerkat-api/share-article/:splat"

[[redirects]]
  force = true
  from = "/*"
  status = 301
  to = "https://os.goconstellation.com/meerkat/:splat"
